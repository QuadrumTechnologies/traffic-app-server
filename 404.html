<head>

<style>
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #121821; --muted: #59606b; --line: #d9dcd5; --accent: #08707d;
  --sig-red: #d23b2e; --sig-amber: #e9a100; --sig-green: #1f9a57;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101317; --surface: #171b21; --ink: #eef2f5; --muted: #a3abb5; --line: #2b313a; --accent: #4cc6d4; --sig-red: #ec5a4c; --sig-amber: #f3b42a; --sig-green: #36c07a; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.6 "Overpass", "Helvetica Neue", Arial, sans-serif; padding: 24px; }
main { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 32px; display: grid; gap: 16px; }
.code { font: 600 0.78rem/1 "Overpass Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.lamp { display: inline-flex; gap: 4px; padding: 4px 6px; background: var(--ink); border-radius: 6px; }
.lamp i { width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, var(--surface) 25%, var(--ink)); }
.lamp i:first-child { background: var(--sig-red); }
h1 { margin: 0; font: 800 clamp(1.6rem, 4vw, 2.1rem)/1.15 "Overpass", "Helvetica Neue", Arial, sans-serif; }
p { margin: 0; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
a.btn { display: inline-flex; align-items: center; padding: 11px 18px 9px; border-radius: 6px; border: 1.5px solid var(--accent); font-weight: 800; text-decoration: none; }
a.solid { background: var(--accent); color: var(--surface); }
a.ghost { color: var(--accent); }
a:focus-visible { outline: 3px solid var(--sig-amber); outline-offset: 3px; }
</style>

  </div>
</main>
</body>
